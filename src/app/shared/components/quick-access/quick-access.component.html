<section class="card bg-base-100 shadow-sm" aria-labelledby="quick-access-title">
  <div class="card-body gap-4 md:flex-row md:items-center">
    <div class="flex-1">
      <h2 id="quick-access-title" class="card-title mb-4">Acessos rápidos</h2>
      <div class="grid gap-3 sm:grid-cols-2">
        @for (item of visibleItems(); track item.id) {
          <a
            [routerLink]="item.route"
            class="btn h-auto justify-start gap-3 border-base-300 bg-base-200 py-4 text-base hover:bg-base-300">
            <app-icon [name]="item.icon" [size]="22" class="text-primary" />
            {{ item.label }}
          </a>
        }
      </div>
    </div>
    <img
      src="assets/images/economia.png"
      alt=""
      class="hidden w-56 shrink-0 md:block lg:w-64" />
  </div>
</section>
