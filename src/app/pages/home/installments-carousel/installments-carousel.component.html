<section class="card h-full bg-base-100 shadow-sm" aria-labelledby="installments-title">
  <div class="card-body min-w-0 gap-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="installments-title" class="card-title">Meus parcelamentos</h2>
        <p class="text-sm text-base-content/80">
          Falta pagar <span class="font-semibold text-base-content tabular-nums">{{ totalRemaining() | currency }}</span>
        </p>
      </div>
      <div class="flex gap-1">
        <button type="button" class="btn btn-circle btn-ghost btn-sm" aria-label="Parcelamento anterior" (click)="scroll(-1)">
          <app-icon name="back" [size]="18" />
        </button>
        <button type="button" class="btn btn-circle btn-ghost btn-sm" aria-label="Próximo parcelamento" (click)="scroll(1)">
          <app-icon name="forward" [size]="18" />
        </button>
      </div>
    </div>

    <ul #track class="carousel w-full gap-4 pb-2" aria-label="Lista de parcelamentos">
      @for (plan of items(); track plan.id) {
        <li class="carousel-item w-60">
          <article class="flex w-full flex-col overflow-hidden rounded-box border border-base-300 bg-base-100">
            <figure class="relative h-32 bg-base-200">
              <img [src]="plan.imageUrl" alt="" class="h-full w-full object-cover" loading="lazy" />
              <span class="badge badge-neutral badge-sm absolute right-2 top-2 tabular-nums">{{ plan.paid }}/{{ plan.total }}</span>
            </figure>
            <div class="flex flex-col gap-2 p-4">
              <h3 class="truncate font-semibold">{{ plan.title }}</h3>
              <p class="text-sm text-base-content/80">
                <span class="font-semibold text-base-content tabular-nums">{{ plan.amount | currency }}</span> por mês
              </p>
              <progress
                class="progress progress-primary w-full"
                [value]="plan.progress * 100"
                max="100"
                [attr.aria-label]="plan.title + ': ' + plan.paid + ' de ' + plan.total + ' parcelas pagas'"></progress>
              <p class="text-xs text-base-content/80">{{ plan.paid }} de {{ plan.total }} parcelas pagas</p>
            </div>
          </article>
        </li>
      }
    </ul>
  </div>
</section>
