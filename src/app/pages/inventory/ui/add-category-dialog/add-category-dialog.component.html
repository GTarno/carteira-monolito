<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="flex items-center gap-3">
    <span class="rounded-box bg-primary/15 p-2 text-primary"><app-icon name="inventory" /></span>
    <h2 class="text-lg font-semibold">Adicionar categoria</h2>
  </div>

  <div class="flex flex-col gap-1">
    <label for="category-name" class="text-sm font-medium">Nome</label>
    <input id="category-name" class="input w-full" [class.input-error]="showError('name')" formControlName="name"
      placeholder="Ex.: Livros, Discos, Jogos..." maxlength="50" autocomplete="off" />
    @if (showError('name')) {
      <p class="text-sm text-error">{{ errorMessage('name') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="category-description" class="text-sm font-medium">Descrição</label>
    <textarea id="category-description" class="textarea w-full" [class.textarea-error]="showError('description')"
      formControlName="description" placeholder="Breve descrição da categoria..." rows="3" maxlength="120"></textarea>
    <div class="flex justify-between gap-2 text-sm">
      <span class="text-error">{{ showError('description') ? errorMessage('description') : '' }}</span>
      <span class="tabular-nums text-base-content/80">{{ form.controls.description.value.length }}/120</span>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <span class="text-sm font-medium" id="category-image-label">Imagem</span>
    <label
      for="category-image"
      class="flex h-40 cursor-pointer items-center justify-center overflow-hidden rounded-box border-2 border-dashed border-base-300 bg-base-200 transition hover:border-primary"
      [class.border-error]="imageError()">
      @if (previewUrl(); as preview) {
        <img [src]="preview" alt="Prévia da imagem da categoria" class="h-full w-full object-cover" />
      } @else {
        <span class="flex flex-col items-center gap-2 text-sm text-base-content/80">
          <app-icon name="image" [size]="32" />
          Clique para escolher uma imagem (até 2 MB)
        </span>
      }
    </label>
    <input id="category-image" type="file" accept="image/*" class="sr-only" aria-labelledby="category-image-label" (change)="onFileSelected($event)" />
    @if (imageError(); as message) {
      <p class="text-sm text-error">{{ message }}</p>
    }
  </div>

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary"><app-icon name="check" [size]="18" /> Salvar</button>
  </div>
</form>
