<section class="card bg-base-100 shadow-sm">
  <div class="card-body flex-col gap-6 sm:flex-row sm:items-center">
    <div class="flex flex-1 items-center gap-4">
      <div class="avatar avatar-placeholder">
        <div class="w-14 rounded-full bg-primary text-primary-content">
          <span class="text-xl font-semibold">{{ persona.nome.charAt(0) }}</span>
        </div>
      </div>
      <div>
        <h2 class="text-xl font-semibold">Olá, {{ persona.nome }}</h2>
        <p class="text-sm text-base-content/80">{{ persona.cargo }}</p>
      </div>
    </div>

    <div class="flex items-center gap-4 rounded-box bg-base-200 px-5 py-4">
      <span class="rounded-box bg-primary/15 p-2.5 text-primary">
        <app-icon name="wallet" [size]="24" />
      </span>
      <div>
        <div class="text-sm text-base-content/80">Valor em caixa</div>
        <div class="text-2xl font-bold tabular-nums">{{ persona.valorEmCaixa | currency }}</div>
      </div>
    </div>
  </div>
</section>
