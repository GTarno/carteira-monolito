<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="flex items-center gap-3">
    <span class="rounded-box bg-primary/15 p-2 text-primary"><app-icon name="edit" /></span>
    <div>
      <h2 class="text-lg font-semibold">Editar valores</h2>
      <p class="text-sm text-base-content/80">{{ data.itemName }}</p>
    </div>
  </div>

  @for (field of [{ key: 'plannedValue', label: 'Valor planejado' }, { key: 'realValue', label: 'Valor gasto' }]; track field.key) {
    <div class="flex flex-col gap-1">
      <label [for]="'edit-' + field.key" class="text-sm font-medium">{{ field.label }}</label>
      <label class="input w-full" [class.input-error]="showError($any(field.key))">
        <span class="text-base-content/80">R$</span>
        <input [id]="'edit-' + field.key" [formControlName]="field.key" inputmode="decimal" placeholder="0,00" autocomplete="off" />
      </label>
      @if (showError($any(field.key))) {
        <p class="text-sm text-error">{{ errorMessage($any(field.key)) }}</p>
      }
    </div>
  }

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      <app-icon name="check" [size]="18" /> Salvar
    </button>
  </div>
</form>
