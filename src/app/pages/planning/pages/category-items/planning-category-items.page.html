<div class="app-ui flex min-w-0 flex-col gap-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <a routerLink="/planejamentos" [queryParams]="{ month: monthKey }" class="btn btn-ghost btn-sm gap-1 px-2">
      <app-icon name="back" [size]="18" /> Planejamento
    </a>
    <button type="button" class="btn btn-primary" (click)="addNewItem()">
      <app-icon name="add" [size]="18" /> Adicionar item
    </button>
  </div>

  @if (error(); as message) {
    <div role="alert" class="alert alert-error alert-soft">
      <app-icon name="error" />
      <span>{{ message }}</span>
    </div>
  }

  @if (loading() && !items()) {
    <div class="flex items-center justify-center gap-3 py-16 text-base-content/70">
      <span class="loading loading-spinner loading-md"></span> Carregando itens...
    </div>
  }

  @if (items(); as list) {
    <app-budget-summary
      [title]="category()?.title ?? 'Categoria'"
      [subtitle]="'Itens do mês · ' + monthLabel"
      [icon]="category()?.icon ?? 'receipt'"
      [planned]="plannedTotal()"
      [spent]="spentTotal()" />

    @if (list.length) {
      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
        @for (item of list; track item.id) {
          <app-budget-card
            [title]="item.name"
            [icon]="item.icon ?? 'receipt'"
            [planned]="item.plannedValue"
            [spent]="item.realValue"
            [link]="['/planejamentos', categoryId, item.id]"
            [queryParams]="{ month: monthKey }" />
        }
      </div>
    } @else {
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body items-center gap-3 py-12 text-center">
          <app-icon name="receipt" [size]="40" class="text-base-content/50" />
          <p class="font-medium">Nenhum item nesta categoria</p>
          <button type="button" class="btn btn-primary btn-sm" (click)="addNewItem()">
            <app-icon name="add" [size]="16" /> Adicionar o primeiro item
          </button>
        </div>
      </div>
    }
  }
</div>
