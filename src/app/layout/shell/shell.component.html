<div class="drawer lg:drawer-open min-h-screen bg-base-200 text-base-content">
  <input
    id="app-drawer"
    type="checkbox"
    class="drawer-toggle"
    aria-label="Mostrar ou esconder o menu"
    [checked]="drawerOpen()"
    (change)="onDrawerToggle($event)" />

  <!-- Conteúdo -->
  <div class="drawer-content flex min-w-0 flex-col">
    <header class="navbar sticky top-0 z-30 gap-2 border-b border-base-300 bg-base-100/90 px-3 backdrop-blur lg:px-6">
      <label for="app-drawer" class="btn btn-ghost btn-square lg:hidden" aria-label="Abrir menu">
        <app-icon name="menu" />
      </label>
      <h1 class="flex-1 truncate text-lg font-semibold">{{ pageTitle() || appName }}</h1>
      <app-theme-toggle />
    </header>

    <main class="flex-1 p-3 md:p-6">
      <router-outlet />
    </main>

    <app-footer />
  </div>

  <!-- Menu lateral -->
  <div class="drawer-side z-40">
    <label for="app-drawer" class="drawer-overlay" aria-label="Fechar menu"></label>
    <aside class="flex min-h-full w-72 flex-col border-r border-base-300 bg-base-100">
      <a routerLink="/home" class="flex items-center gap-3 px-6 py-5 text-xl font-bold">
        <span class="rounded-box bg-primary p-2 text-primary-content">
          <app-icon name="wallet" [size]="22" />
        </span>
        {{ appName }}
      </a>

      <nav aria-label="Menu principal">
        <ul class="menu w-full gap-1 px-3 text-base">
          @for (item of menuItems; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="menu-active"
                ariaCurrentWhenActive="page"
                class="gap-3 py-3"
                (click)="drawerOpen.set(false)">
                <app-icon [name]="item.icon" />
                <span class="flex flex-col">
                  <span>{{ item.label }}</span>
                  @if (item.description) {
                    <span class="text-xs opacity-80">{{ item.description }}</span>
                  }
                </span>
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>
  </div>
</div>
