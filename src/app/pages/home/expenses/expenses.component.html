<section class="flex flex-col gap-4" aria-labelledby="expenses-title">
  <h2 id="expenses-title" class="text-lg font-semibold">Análise de gastos</h2>

  <div class="grid gap-6 lg:grid-cols-3">
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <app-doughnut-chart [data]="expenseCategories" title="Gastos por categoria" height="220px" />
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm lg:col-span-2">
      <div class="card-body">
        <app-bar-chart [data]="monthlyBudgets" title="Gastos mensais vs orçamento" height="280px" />
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm lg:col-span-3">
      <div class="card-body">
        <app-line-chart [trendData]="trendData" title="Tendência semanal por categoria" height="280px" />
      </div>
    </div>
  </div>
</section>
