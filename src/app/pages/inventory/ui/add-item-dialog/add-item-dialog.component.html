<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="flex items-center gap-3">
    <span class="rounded-box bg-primary/15 p-2 text-primary"><app-icon name="add" /></span>
    <div>
      <h2 class="text-lg font-semibold">Adicionar item</h2>
      <p class="text-sm text-base-content/80">{{ categoryName }}</p>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label for="item-title" class="text-sm font-medium">{{ labels.title }}</label>
    <input id="item-title" class="input w-full" [class.input-error]="showError('title')" formControlName="title"
      [placeholder]="labels.titlePlaceholder" maxlength="100" autocomplete="off" />
    @if (showError('title')) {
      <p class="text-sm text-error">{{ errorMessage('title') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="item-author" class="text-sm font-medium">{{ labels.author }}</label>
    <input id="item-author" class="input w-full" [class.input-error]="showError('author')" formControlName="author"
      [placeholder]="labels.authorPlaceholder" maxlength="80" autocomplete="off" />
    @if (showError('author')) {
      <p class="text-sm text-error">{{ errorMessage('author') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="item-notes" class="text-sm font-medium">Observações <span class="font-normal text-base-content/80">(opcional)</span></label>
    <textarea id="item-notes" class="textarea w-full" [class.textarea-error]="showError('notes')" formControlName="notes"
      placeholder="Estado do item, edição..." rows="3" maxlength="200"></textarea>
    <div class="flex justify-between gap-2 text-sm">
      <span class="text-error">{{ showError('notes') ? errorMessage('notes') : '' }}</span>
      <span class="tabular-nums text-base-content/80">{{ form.controls.notes.value.length }}/200</span>
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary"><app-icon name="check" [size]="18" /> Salvar item</button>
  </div>
</form>
