<div class="flex min-w-0 flex-col gap-6">
  <div>
    <h2 class="text-2xl font-bold">Que tipo de gasto você quer registrar?</h2>
    <p class="text-sm text-base-content/80">Escolha uma opção para continuar.</p>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    @for (option of options; track option.type) {
      <button
        type="button"
        class="card overflow-hidden bg-base-100 text-left shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="onSelect(option)">
        <figure class="h-48 bg-base-200">
          <img [src]="option.image" alt="" class="h-full w-full object-cover" loading="lazy" />
        </figure>
        <div class="card-body flex-row items-center gap-4">
          <span class="rounded-box bg-primary/15 p-3 text-primary">
            <app-icon [name]="option.icon" [size]="24" />
          </span>
          <div class="flex-1">
            <h3 class="card-title">{{ option.title }}</h3>
            <p class="text-sm text-base-content/80">{{ option.description }}</p>
          </div>
          <app-icon name="forward" class="text-base-content/50" />
        </div>
      </button>
    }
  </div>
</div>
