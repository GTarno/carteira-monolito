<form class="app-ui flex flex-col gap-5" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="flex items-center gap-3">
    <span class="rounded-box bg-primary/15 p-2 text-primary"><app-icon name="add" /></span>
    <h2 class="text-lg font-semibold">Adicionar item</h2>
  </div>

  <div class="flex flex-col gap-1">
    <label for="item-name" class="text-sm font-medium">Nome do item</label>
    <input
      id="item-name"
      class="input w-full"
      [class.input-error]="showError('name')"
      formControlName="name"
      placeholder="Ex.: Conta de luz, Mercado..."
      maxlength="50"
      autocomplete="off" />
    @if (showError('name')) {
      <p class="text-sm text-error">{{ nameError() }}</p>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="item-value" class="text-sm font-medium">Valor planejado</label>
    <label class="input w-full" [class.input-error]="showError('plannedValue')">
      <span class="text-base-content/60">R$</span>
      <input id="item-value" formControlName="plannedValue" inputmode="decimal" placeholder="0,00" autocomplete="off" />
    </label>
    @if (showError('plannedValue')) {
      <p class="text-sm text-error">{{ valueError() }}</p>
    }
  </div>

  <fieldset class="flex flex-col gap-2">
    <legend class="mb-2 text-sm font-medium">Ícone</legend>
    <div class="grid grid-cols-3 gap-2 sm:grid-cols-6" role="radiogroup" aria-label="Ícone do item">
      @for (option of icons; track option.icon) {
        <button
          type="button"
          role="radio"
          class="btn h-auto flex-col gap-1 px-1 py-2 text-xs font-normal"
          [class.btn-primary]="selectedIcon() === option.icon"
          [class.btn-ghost]="selectedIcon() !== option.icon"
          [attr.aria-checked]="selectedIcon() === option.icon"
          (click)="selectedIcon.set(option.icon)">
          <app-icon [name]="option.icon" />
          {{ option.name }}
        </button>
      }
    </div>
    @if (submitted() && !selectedIcon()) {
      <p class="text-sm text-error">Escolha um ícone para o item.</p>
    }
  </fieldset>

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      <app-icon name="check" [size]="18" /> Salvar
    </button>
  </div>
</form>
